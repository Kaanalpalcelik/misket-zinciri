<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"/>
<meta name="theme-color" content="#050912"/>
<title>Misket Zinciri — Premium Level 1</title>
<style>
:root {
  --bg:#050912; --navy:#071521; --navy2:#0a1d2d; --line:#18384e;
  --gold:#ffc95c; --gold2:#ff9f1a; --cyan:#61e8ff; --text:#f8fbff; --muted:#a9bed0;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:
radial-gradient(1200px 700px at 50% -15%,#193958 0%,#07101b 48%,#02050a 100%);
font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;color:var(--text)}
body{display:flex;align-items:center;justify-content:center;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
.app{width:min(100vw,460px);height:100dvh;max-height:980px;display:flex;flex-direction:column;position:relative;overflow:hidden;
background:linear-gradient(180deg,#081524 0%,#04070e 100%)}
.top{height:94px;flex:0 0 94px;padding:8px 9px 7px;display:grid;grid-template-columns:64px 1.45fr 1fr .9fr 1.08fr;gap:7px;
background:linear-gradient(180deg,rgba(4,10,17,.96),rgba(6,16,25,.84));border-bottom:1px solid rgba(255,255,255,.07);
box-shadow:0 7px 30px rgba(0,0,0,.35);z-index:4}
.card,.pause{border:1px solid #214866;background:
linear-gradient(180deg,rgba(9,27,42,.98),rgba(4,15,25,.98));box-shadow:inset 0 1px 0 rgba(255,255,255,.06),0 6px 18px rgba(0,0,0,.22)}
.pause{border-radius:50%;width:60px;height:60px;align-self:center;display:grid;place-items:center;font-size:27px;color:var(--gold);
border-color:#a87623;box-shadow:inset 0 0 0 2px rgba(255,207,92,.12),0 0 20px rgba(255,181,40,.11)}
.card{border-radius:14px;padding:7px 7px 5px;min-width:0;display:flex;flex-direction:column;justify-content:center;text-align:center}
.card .k{font-size:10px;letter-spacing:.08em;color:#8fb9d4;text-transform:uppercase;white-space:nowrap}
.card .v{font-size:21px;font-weight:900;line-height:1.1;margin-top:2px;white-space:nowrap}
.level{text-align:left;padding-left:11px}.level .v{font-size:18px}.level .s{font-size:11px;color:#c3cfda;margin-top:3px}
.gold{color:var(--gold)}.cyan{color:var(--cyan)}
.stage{position:relative;flex:1;min-height:0;background:#071019;overflow:hidden}
canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
.shine{position:absolute;inset:0;pointer-events:none;background:
radial-gradient(65% 33% at 50% 8%,rgba(255,223,145,.14),transparent 70%),
linear-gradient(90deg,transparent 0 46%,rgba(255,255,255,.025) 50%,transparent 54% 100%);mix-blend-mode:screen}
.toast{position:absolute;left:50%;top:83px;transform:translateX(-50%) translateY(-10px);opacity:0;
padding:8px 14px;border-radius:20px;background:rgba(4,17,28,.92);border:1px solid rgba(255,208,92,.45);
color:#fff;font-size:12px;font-weight:800;letter-spacing:.02em;z-index:5;transition:.22s;white-space:nowrap;
box-shadow:0 10px 28px rgba(0,0,0,.35),0 0 24px rgba(255,190,60,.12)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.bottom{height:82px;flex:0 0 82px;padding:8px 10px 7px;display:flex;gap:8px;align-items:center;justify-content:space-between;
background:linear-gradient(180deg,#07121e,#03060b);border-top:1px solid rgba(255,255,255,.07);z-index:4}
.power{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;position:relative;font-size:26px;background:
radial-gradient(circle at 35% 28%,#173b58,#07131f 68%);border:1px solid #376985;box-shadow:inset 0 2px 0 rgba(255,255,255,.08),0 8px 20px rgba(0,0,0,.35)}
.power b{position:absolute;right:-2px;bottom:-2px;width:20px;height:20px;border-radius:50%;background:#184e87;border:2px solid #8bdcff;
font-size:10px;display:grid;place-items:center}
.hint{flex:1;text-align:center;color:#bfd0dc;font-size:11px;line-height:1.3;padding:0 5px}
.hint strong{color:#fff;font-size:13px}
.restart{border:1px solid #a66e17;background:linear-gradient(180deg,#1b2832,#0b131a);color:#ffd57e;border-radius:16px;padding:11px 13px;
font-weight:900;font-size:12px;box-shadow:inset 0 1px 0 rgba(255,255,255,.07),0 6px 18px rgba(0,0,0,.3)}
.overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(2,7,12,.58);backdrop-filter:blur(6px);z-index:8;opacity:0;pointer-events:none;transition:.25s}
.overlay.show{opacity:1;pointer-events:auto}
.modal{width:min(86%,340px);padding:24px;border-radius:24px;text-align:center;background:linear-gradient(180deg,#0e2435,#07131f);
border:1px solid #2f5870;box-shadow:0 28px 70px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.06)}
.modal h1{margin:0 0 6px;font-size:28px}.modal .big{font-size:36px;font-weight:950;color:#ffd36e}
.modal p{color:#a9bdcb;font-size:13px}.modal button{border:none;border-radius:16px;padding:12px 20px;font-weight:900;
background:linear-gradient(180deg,#ffc95c,#df8b18);color:#1e1302;font-size:15px}
@media(max-height:720px){.top{height:82px;flex-basis:82px}.pause{width:52px;height:52px}.card .v{font-size:18px}.bottom{height:72px;flex-basis:72px}.power{width:50px;height:50px}}
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <div class="pause" id="pause">Ⅱ</div>
    <div class="card level"><div class="k">Bölüm 1</div><div class="v gold">Başlangıç</div><div class="s">Premium masa</div></div>
    <div class="card"><div class="k">Hedef</div><div class="v"><span class="gold">●</span> <span id="left">12</span></div></div>
    <div class="card"><div class="k">Atış</div><div class="v" id="shots">0</div></div>
    <div class="card"><div class="k">Süre</div><div class="v cyan" id="time">0.0</div></div>
  </div>
  <div class="stage">
    <canvas id="game" width="768" height="1072"></canvas>
    <div class="shine"></div>
    <div class="toast" id="toast">Çek, nişan al, bırak!</div>
  </div>
  <div class="bottom">
    <div class="power">🧲<b>3</b></div>
    <div class="power">❄️<b>3</b></div>
    <div class="hint"><strong>Beyaz topu geriye çek</strong><br>Mesafe = güç · bırak = vur</div>
    <button class="restart" id="restart">YENİDEN</button>
  </div>
  <div class="overlay" id="overlay"><div class="modal">
    <h1 id="resultTitle">Bölüm Temiz!</h1>
    <div class="big" id="resultTime">0.0 sn</div>
    <p id="resultMeta"></p>
    <button id="again">Tekrar Oyna</button>
  </div></div>
</div>

const imgs={}; let loaded=0;
for(const [k,v] of Object.entries(AS)){const im=new Image();im.onload=()=>{imgs[k]=im;if(++loaded===Object.keys(AS).length)init()};im.src=v}
const ui={
 left:document.getElementById('left'),shots:document.getElementById('shots'),time:document.getElementById('time'),
 toast:document.getElementById('toast'),overlay:document.getElementById('overlay'),resultTime:document.getElementById('resultTime'),
 resultMeta:document.getElementById('resultMeta')
};
let audio=null,paused=false,drag=false,dragP=null,startT=null,last=0,shots=0,ended=false,shake=0;
const state={cue:null,balls:[],particles:[],popups:[]};
const R=26,CR=28,fr=.986,stop=.055,bounce=.92;
const bounds={l:78,r:690,t:52,b:982};
const holes=[{x:255,y:355,r:35},{x:535,y:355,r:35}];
const obs=[
 {x:250,y:285,w:132,h:30,a:0.37},
 {x:518,y:285,w:132,h:30,a:-0.37},
 {x:132,y:518,w:36,h:150,a:0},
 {x:636,y:518,w:36,h:150,a:0}
];
const starts=[
 [214,171,'red'],[384,177,'blue'],[552,171,'red'],
 [275,250,'green'],[493,250,'green'],[384,302,'gold'],
 [384,446,'blue'],[220,565,'gold'],[548,565,'green'],
 [186,700,'blue'],[286,795,'green'],[502,795,'red']
];
function init(){
 reset(); addEventListener('resize',()=>{}, {passive:true}); requestAnimationFrame(loop);
 setTimeout(()=>showToast('Çek, nişan al, bırak!'),550);
}
function reset(){
 shots=0;startT=null;ended=false;paused=false;drag=false;dragP=null;last=performance.now();
 state.cue={x:384,y:925,vx:0,vy:0,r:CR,type:'cue',dead:false};
 state.balls=starts.map((b,i)=>({id:i,x:b[0],y:b[1],vx:0,vy:0,r:R,type:b[2],dead:false,hit:false,hitAt:0}));
 state.particles=[];state.popups=[];ui.overlay.classList.remove('show');document.getElementById('pause').textContent='Ⅱ';updateUI();
}
function updateUI(){
 ui.left.textContent=state.balls.filter(b=>!b.dead).length;ui.shots.textContent=shots;
 const t=startT&&!ended?(performance.now()-startT)/1000:0;ui.time.textContent=t.toFixed(1);
}
function showToast(s){ui.toast.textContent=s;ui.toast.classList.add('show');clearTimeout(showToast.t);showToast.t=setTimeout(()=>ui.toast.classList.remove('show'),1200)}
function unlock(){
 if(!audio){audio=new (window.AudioContext||window.webkitAudioContext)()}
 if(audio.state==='suspended')audio.resume();
}
function tone(freq=220,d=.05,g=.028,type='sine'){if(!audio)return;const o=audio.createOscillator(),gn=audio.createGain(),t=audio.currentTime;
 o.type=type;o.frequency.setValueAtTime(freq,t);o.frequency.exponentialRampToValueAtTime(Math.max(70,freq*.65),t+d);
 gn.gain.setValueAtTime(g,t);gn.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(gn);gn.connect(audio.destination);o.start(t);o.stop(t+d)}
function hitSound(p=1){tone(210+90*p,.045,.018*p,'triangle')}
function pocketSound(){tone(420,.11,.035,'triangle');setTimeout(()=>tone(220,.12,.022,'sine'),30)}
function speed(b){return Math.hypot(b.vx,b.vy)}
function stopped(){return speed(state.cue)<.18&&!state.balls.some(b=>!b.dead&&speed(b)>.18)}
function local(e){const r=C.getBoundingClientRect();return{x:(e.clientX-r.left)*W/r.width,y:(e.clientY-r.top)*H/r.height}}
C.addEventListener('pointerdown',e=>{unlock();if(ended||paused||!stopped())return;const p=local(e),dx=p.x-state.cue.x,dy=p.y-state.cue.y;
 if(Math.hypot(dx,dy)<58){drag=true;dragP=p;C.setPointerCapture(e.pointerId)}});
C.addEventListener('pointermove',e=>{if(!drag)return;let p=local(e),dx=p.x-state.cue.x,dy=p.y-state.cue.y,l=Math.hypot(dx,dy),m=165;
 if(l>m)p={x:state.cue.x+dx/l*m,y:state.cue.y+dy/l*m};dragP=p});
C.addEventListener('pointerup',()=>{if(!drag)return;drag=false;const p=dragP;dragP=null;if(!p)return;const dx=state.cue.x-p.x,dy=state.cue.y-p.y,l=Math.hypot(dx,dy);if(l<8)return;
 if(!startT)startT=performance.now();const power=7.1+Math.min(l,165)*.095;state.cue.vx=dx/l*power;state.cue.vy=dy/l*power;shots++;hitSound(.8);shake=3;updateUI()});
C.addEventListener('pointercancel',()=>{drag=false;dragP=null});
function rail(b){
 if(b.x-b.r<bounds.l){b.x=bounds.l+b.r;b.vx=Math.abs(b.vx)*bounce;hitSound(.35)}
 if(b.x+b.r>bounds.r){b.x=bounds.r-b.r;b.vx=-Math.abs(b.vx)*bounce;hitSound(.35)}
 if(b.y-b.r<bounds.t){b.y=bounds.t+b.r;b.vy=Math.abs(b.vy)*bounce;hitSound(.35)}
 if(b.y+b.r>bounds.b){b.y=bounds.b-b.r;b.vy=-Math.abs(b.vy)*bounce;hitSound(.35)}
}
function rotRectCollide(b,o){
 const ca=Math.cos(-o.a),sa=Math.sin(-o.a),dx=b.x-o.x,dy=b.y-o.y;let lx=dx*ca-dy*sa,ly=dx*sa+dy*ca;
 const hx=o.w/2,hy=o.h/2,nx=Math.max(-hx,Math.min(hx,lx)),ny=Math.max(-hy,Math.min(hy,ly));
 let vx=lx-nx,vy=ly-ny,d=Math.hypot(vx,vy);if(d>=b.r)return;
 if(d<.001){ if(hx-Math.abs(lx)<hy-Math.abs(ly)){vx=Math.sign(lx)||1;vy=0}else{vx=0;vy=Math.sign(ly)||1};d=1}
 vx/=d;vy/=d;const pen=b.r-d+1;lx+=vx*pen;ly+=vy*pen;
 const ca2=Math.cos(o.a),sa2=Math.sin(o.a);b.x=o.x+lx*ca2-ly*sa2;b.y=o.y+lx*sa2+ly*ca2;
 const nvx=vx*ca2-vy*sa2,nvy=vx*sa2+vy*ca2,proj=b.vx*nvx+b.vy*nvy;if(proj<0){b.vx-=1.9*proj*nvx;b.vy-=1.9*proj*nvy;hitSound(.45)}
}
function collide(a,b,trigger=false){
 if(a.dead||b.dead)return;const dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy)||.001,m=a.r+b.r;if(d>=m)return;
 const nx=dx/d,ny=dy/d,over=m-d;a.x-=nx*over*.5;a.y-=ny*over*.5;b.x+=nx*over*.5;b.y+=ny*over*.5;
 const rvx=b.vx-a.vx,rvy=b.vy-a.vy,sep=rvx*nx+rvy*ny;if(sep<0){const j=-(1.86)*sep/2;a.vx-=j*nx;a.vy-=j*ny;b.vx+=j*nx;b.vy+=j*ny;hitSound(Math.min(1.2,Math.abs(sep)/9+.35))}
 if(trigger&&!b.hit&&speed(a)>.7)markHit(b);
}
function markHit(b){
 b.hit=true;b.hitAt=performance.now();spark(b.x,b.y,b.type,22);popup('+'+(b.type==='gold'?25:10),b.x,b.y-12,b.type==='gold'?'#ffd562':'#ffffff');
 if(b.type==='gold')showToast('GOLD HIT! +25');shake=5;
}
function spark(x0,y0,type,n){const col={red:'#ff304c',blue:'#1ba7ff',green:'#4eea36',gold:'#ffc329'}[type]||'#fff';
 for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,s=1+Math.random()*4;state.particles.push({x:x0,y:y0,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:22+Math.random()*20,c:col,r:1.5+Math.random()*3})}}
function popup(t,x0,y0,c){state.popups.push({t,x:x0,y:y0,c,life:42})}
function checkHoles(b,isCue=false){
 for(const h of holes){if(Math.hypot(b.x-h.x,b.y-h.y)<h.r){if(isCue){fail();return true}else if(!b.dead){b.dead=true;spark(b.x,b.y,b.type,28);popup('POCKET +45',b.x,b.y,'#ffd562');pocketSound()}return true}}return false;
}
function fail(){ended=true;ui.resultTime.textContent='Faul!';ui.resultMeta.textContent='Beyaz top deliğe girdi.';document.getElementById('resultTitle').textContent='Tekrar Dene';ui.overlay.classList.add('show')}
function step(dt){
 if(paused||ended)return;
 const all=[state.cue,...state.balls.filter(b=>!b.dead)];
 const maxS=Math.max(...all.map(speed),0),sub=maxS>18?3:maxS>11?2:1,dd=dt/sub;
 for(let q=0;q<sub;q++){for(const b of all){b.x+=b.vx*dd;b.y+=b.vy*dd;b.vx*=Math.pow(fr,dd);b.vy*=Math.pow(fr,dd);if(speed(b)<stop){b.vx=0;b.vy=0}rail(b);for(const o of obs)rotRectCollide(b,o);}
 for(const b of state.balls)if(!b.dead)collide(state.cue,b,true);
 for(let i=0;i<state.balls.length;i++)for(let j=i+1;j<state.balls.length;j++){const a=state.balls[i],b=state.balls[j];if(a.dead||b.dead)continue;const ah=a.hit,bh=b.hit;collide(a,b,ah);collide(b,a,bh)}
 if(checkHoles(state.cue,true))return;for(const b of state.balls)if(!b.dead)checkHoles(b,false);
 }
 const n=performance.now();for(const b of state.balls)if(!b.dead&&b.hit&&n-b.hitAt>520){b.dead=true;spark(b.x,b.y,b.type,24)}
 for(let i=state.particles.length-1;i>=0;i--){const p=state.particles[i];p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=.96;p.vy*=.96;p.life-=1.1;if(p.life<=0)state.particles.splice(i,1)}
 for(let i=state.popups.length-1;i>=0;i--){const p=state.popups[i];p.y-=.55*dt;p.life-=1;if(p.life<=0)state.popups.splice(i,1)}
 updateUI();if(!ended&&state.balls.every(b=>b.dead))complete();
}
function complete(){ended=true;const t=startT?(performance.now()-startT)/1000:0;document.getElementById('resultTitle').textContent='Bölüm Temiz!';ui.resultTime.textContent=t.toFixed(1)+' sn';ui.resultMeta.textContent=shots+' atış · premium Level 1 demo';ui.overlay.classList.add('show');tone(620,.16,.035,'triangle');setTimeout(()=>tone(820,.18,.03,'triangle'),90)}
function draw(){
 x.save();if(shake>0){x.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);shake*=.86;if(shake<.2)shake=0}
 x.drawImage(imgs.board,0,0,W,H);
 for(const h of holes){const g=x.createRadialGradient(h.x,h.y,4,h.x,h.y,48);g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(.72,'rgba(255,194,70,.03)');g.addColorStop(1,'rgba(255,194,70,.20)');x.fillStyle=g;x.beginPath();x.arc(h.x,h.y,48,0,Math.PI*2);x.fill()}
 if(drag&&dragP){const dx=state.cue.x-dragP.x,dy=state.cue.y-dragP.y,l=Math.hypot(dx,dy)||1,nx=dx/l,ny=dy/l,p=Math.min(l,165);
 x.save();x.setLineDash([10,10]);x.lineWidth=4;x.strokeStyle='rgba(255,255,255,.95)';x.shadowColor='#69eaff';x.shadowBlur=12;x.beginPath();x.moveTo(state.cue.x,state.cue.y);x.lineTo(state.cue.x+nx*(150+p*.8),state.cue.y+ny*(150+p*.8));x.stroke();x.restore();
 x.strokeStyle='rgba(255,203,89,.85)';x.lineWidth=4;x.beginPath();x.arc(state.cue.x,state.cue.y,CR+8+p*.05,0,Math.PI*2);x.stroke()}
 for(const b of state.balls)if(!b.dead)ball(b);
 ball(state.cue);
 for(const p of state.particles){x.globalAlpha=Math.max(0,p.life/35);x.fillStyle=p.c;x.shadowColor=p.c;x.shadowBlur=10;x.beginPath();x.arc(p.x,p.y,p.r,0,Math.PI*2);x.fill();x.globalAlpha=1}
 for(const p of state.popups){x.globalAlpha=Math.min(1,p.life/16);x.font='900 22px Inter,system-ui';x.textAlign='center';x.lineWidth=5;x.strokeStyle='rgba(0,0,0,.45)';x.strokeText(p.t,p.x,p.y);x.fillStyle=p.c;x.fillText(p.t,p.x,p.y);x.globalAlpha=1}
 x.restore();
}
function ball(b){const im=imgs[b.type];if(!im)return;const s=b.type==='cue'?66:61;
 x.save();x.translate(b.x,b.y);
 x.fillStyle='rgba(0,0,0,.28)';x.filter='blur(3px)';x.beginPath();x.ellipse(5,22,s*.36,s*.13,0,0,Math.PI*2);x.fill();x.filter='none';
 x.shadowColor=b.type==='gold'?'rgba(255,191,49,.6)':'rgba(0,0,0,.26)';x.shadowBlur=b.type==='gold'?18:8;x.drawImage(im,-s/2,-s/2,s,s);
 if(b.hit){x.strokeStyle='rgba(255,255,255,.7)';x.lineWidth=3;x.beginPath();x.arc(0,0,s*.56+Math.sin(performance.now()/70)*4,0,Math.PI*2);x.stroke()}
 x.restore();}
function loop(t){let dt=Math.min(1.5,(t-last)/16.666||1);last=t;step(dt);draw();requestAnimationFrame(loop)}
document.getElementById('restart').onclick=()=>{unlock();reset();showToast('Yeni deneme')};
document.getElementById('again').onclick=()=>{reset();showToast('Çek, nişan al, bırak!')};
document.getElementById('pause').onclick=()=>{paused=!paused;document.getElementById('pause').textContent=paused?'▶':'Ⅱ';showToast(paused?'Duraklatıldı':'Devam')};
})();
</script>
