<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
  <meta name="theme-color" content="#071420" />
  <title>Misket Zinciri — Noverax Games</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@600;700;800&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
  <style>
    :root{
      --bg:#08131d;--panel:#0b2030;--panel2:#06131d;--gold:#f4b53e;--gold2:#ffdc78;
      --green:#087d57;--green2:#0a9b6c;--ice:#d7f5ff;--ink:#eaf8ff;--muted:#91b4c8;
    }
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    html,body{height:100%;margin:0;background:radial-gradient(circle at 50% -10%,#233a48 0,#07121b 44%,#040b11 100%);font-family:Inter,system-ui,sans-serif;color:var(--ink);overflow:hidden}
    body:before,body:after{content:"";position:fixed;inset:auto;filter:blur(50px);opacity:.35;pointer-events:none}
    body:before{width:180px;height:300px;left:-90px;top:10%;background:#ff7b18}
    body:after{width:180px;height:300px;right:-90px;top:16%;background:#ff8a1d}
    #app{height:100dvh;max-width:780px;margin:auto;display:flex;flex-direction:column;padding:max(8px,env(safe-area-inset-top)) 10px max(8px,env(safe-area-inset-bottom));gap:8px;position:relative}
    .hud{display:grid;grid-template-columns:72px 1.35fr 1fr .88fr 1.15fr;gap:7px;align-items:stretch;z-index:3}
    .hud-card,.pause{background:linear-gradient(180deg,rgba(16,48,70,.96),rgba(3,19,30,.98));border:1px solid rgba(150,219,255,.25);box-shadow:inset 0 0 0 1px rgba(255,255,255,.03),0 8px 18px rgba(0,0,0,.28);border-radius:16px;min-height:70px}
    .pause{display:grid;place-items:center;font-size:30px;color:#ffd46a;border-color:#b98b30;cursor:pointer}
    .hud-card{padding:8px 10px;display:flex;flex-direction:column;justify-content:center;align-items:center;line-height:1}
    .hud-card strong{font-size:22px;margin-top:5px}.hud-card span{font-size:12px;color:#bfe6f9;letter-spacing:.5px}
    .chapter{align-items:flex-start;padding-left:14px}.chapter strong{font-size:15px;font-weight:700;color:white}.chapter .sub{color:#dbefff;font-size:14px;margin-top:7px;font-weight:600}
    .crown{color:#ffd761;text-shadow:0 0 14px #ffb000;font-size:24px;margin-right:5px}
    .board-shell{flex:1;min-height:0;border-radius:38px;padding:15px;background:linear-gradient(135deg,#f6c85a,#9d4e0a 16%,#542400 24%,#8d4614 50%,#3c1600 74%,#dc8a24 90%,#ffe17e);box-shadow:0 20px 42px #0009,inset 0 0 0 2px #ffe597;position:relative}
    .board-shell:before{content:"";position:absolute;inset:7px;border-radius:32px;border:2px solid rgba(255,219,111,.55);pointer-events:none}
    .board{height:100%;border-radius:26px;overflow:hidden;position:relative;background:radial-gradient(circle at 50% 34%,#0c9f6d,#087c57 52%,#056b4c 100%);box-shadow:inset 0 0 35px #002f22,inset 0 0 0 3px #13a878}
    canvas{display:block;width:100%;height:100%;touch-action:none}
    .brand{position:absolute;left:50%;top:54%;transform:translate(-50%,-50%);text-align:center;opacity:.22;pointer-events:none;z-index:1}
    .brand .icon{font-size:54px;line-height:.8}.brand .name{font-family:"Playfair Display",serif;font-size:30px;letter-spacing:1px}
    .hint{position:absolute;left:50%;bottom:14%;transform:translateX(-50%);background:#071b29d9;border:1px solid rgba(168,227,255,.24);padding:12px 18px;border-radius:24px;font-size:14px;font-weight:800;box-shadow:0 7px 18px #001;pointer-events:none;transition:.25s;z-index:4;white-space:nowrap}
    .hint.hide{opacity:0;transform:translate(-50%,8px)}
    .powers{height:66px;display:flex;justify-content:space-between;align-items:center;padding:0 5px}
    .power-group{display:flex;gap:10px}.power{width:58px;height:58px;border-radius:50%;background:linear-gradient(#153c56,#071824);border:1px solid #7cc8ef;display:grid;place-items:center;font-size:25px;position:relative;box-shadow:0 5px 13px #0008;cursor:pointer}
    .power small{position:absolute;right:-3px;bottom:-1px;width:22px;height:22px;border-radius:50%;background:#173b58;border:1px solid #b8e8ff;font-size:12px;display:grid;place-items:center}
    .level-tag{border:1px solid #d99b31;color:#ffc75e;background:#171008;border-radius:19px;padding:12px 20px;font-weight:800;letter-spacing:.5px}
    .footer{font-family:"Playfair Display",serif;position:absolute;bottom:7px;left:50%;transform:translateX(-50%);font-size:11px;color:#d6a151;letter-spacing:2px;pointer-events:none}
    .overlay{position:absolute;inset:0;background:#02070dcc;backdrop-filter:blur(9px);display:none;align-items:center;justify-content:center;z-index:10;padding:24px}.overlay.show{display:flex}
    .modal{width:min(420px,92%);background:linear-gradient(180deg,#102b3d,#06121c);border:1px solid #7db6d1;border-radius:26px;padding:28px;text-align:center;box-shadow:0 24px 80px #000}
    .modal h2{font-size:30px;margin:0 0 10px}.modal p{color:#b5d1df;line-height:1.5}.modal button{border:0;border-radius:16px;padding:14px 20px;font-weight:800;font-size:16px;background:linear-gradient(#ffd66c,#e5931d);color:#231600;min-width:160px;cursor:pointer}
    .score-pop{position:absolute;font-weight:900;color:#ffe378;text-shadow:0 2px 8px #000;font-size:18px;pointer-events:none;animation:pop .7s ease-out forwards;z-index:5}@keyframes pop{to{transform:translateY(-45px) scale(1.2);opacity:0}}
    @media(max-width:560px){#app{padding-left:6px;padding-right:6px}.hud{grid-template-columns:54px 1.25fr .8fr .72fr 1.05fr;gap:4px}.hud-card,.pause{min-height:56px;border-radius:13px}.pause{font-size:24px}.hud-card{padding:6px 5px}.hud-card span{font-size:9px}.hud-card strong{font-size:18px}.chapter{padding-left:8px}.chapter strong{font-size:11px}.chapter .sub{font-size:11px;margin-top:5px}.crown{font-size:18px}.board-shell{padding:11px;border-radius:30px}.board{border-radius:21px}.powers{height:56px}.power{width:48px;height:48px;font-size:21px}.level-tag{padding:10px 14px;font-size:12px}.footer{bottom:4px}}
  </style>
</head>
<body>
<div id="app">
  <div class="hud">
    <button class="pause" id="pauseBtn" aria-label="Duraklat">Ⅱ</button>
    <div class="hud-card chapter"><strong><span class="crown">♛</span>BÖLÜM 1</strong><div class="sub">Başlangıç</div></div>
    <div class="hud-card"><span>HEDEF</span><strong>🟡 <b id="target">12</b></strong></div>
    <div class="hud-card"><span>ATIŞ</span><strong id="shots">0</strong></div>
    <div class="hud-card"><span>SÜRE</span><strong id="time">01:30</strong></div>
  </div>
  <div class="board-shell">
    <div class="board" id="board">
      <div class="brand"><div class="icon">♛</div><div class="name">MİSKET<br>ZİNCİRİ</div></div>
      <canvas id="game"></canvas>
      <div class="hint" id="hint">Çek, nişan al, bırak!</div>
    </div>
  </div>
  <div class="powers">
    <div class="power-group">
      <button class="power" id="magnet" title="Mıknatıs">🧲<small>3</small></button>
      <button class="power" id="freeze" title="Dondur">❄<small>3</small></button>
      <button class="power" id="aim" title="Uzun nişan">⌾<small>3</small></button>
    </div>
    <div class="level-tag">BÖLÜM 1</div>
  </div>
  <div class="footer">NOVERAX GAMES</div>

  <div class="overlay" id="overlay"><div class="modal"><h2 id="modalTitle">Duraklatıldı</h2><p id="modalText">Hazır olduğunda devam et.</p><button id="modalBtn">DEVAM ET</button></div></div>
</div>
<script>
(() => {
  const canvas = document.getElementById('game');
  const board = document.getElementById('board');
  const ctx = canvas.getContext('2d');
  const DPR = Math.min(2, window.devicePixelRatio || 1);
  let W=0,H=0, balls=[], pockets=[], bumpers=[], cue, dragging=false, dragX=0, dragY=0, running=true, ended=false;
  let shots=0, remaining=12, seconds=90, last=performance.now(), accum=0, aimBoost=false, frozen=false;
  const colors=['#f21f3f','#0f8cff','#32bd38','#ffbd12'];
  const ui={shots:document.getElementById('shots'),target:document.getElementById('target'),time:document.getElementById('time'),hint:document.getElementById('hint'),overlay:document.getElementById('overlay'),title:document.getElementById('modalTitle'),text:document.getElementById('modalText'),btn:document.getElementById('modalBtn')};
  const audioCtx = new (window.AudioContext||window.webkitAudioContext)();
  function beep(freq=500,d=.06,vol=.05,type='sine'){
    try{ const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type=type;o.frequency.value=freq;g.gain.value=vol;o.connect(g);g.connect(audioCtx.destination);o.start();g.gain.exponentialRampToValueAtTime(.0001,audioCtx.currentTime+d);o.stop(audioCtx.currentTime+d);}catch(e){}
  }
  function resize(){
    const r=board.getBoundingClientRect();W=r.width;H=r.height;canvas.width=W*DPR;canvas.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0);setup(true);
  }
  function setup(resizing=false){
    const s=Math.min(W,H);const R=Math.max(13,s*.029);const pR=Math.max(25,s*.055);
    pockets=[
      {x:4,y:5},{x:W-4,y:5},{x:4,y:H-5},{x:W-4,y:H-5},
      {x:W*.25,y:H*.39},{x:W*.75,y:H*.39}
    ].map(p=>({...p,r:pR}));
    bumpers=[
      {x:W*.28,y:H*.28,w:W*.20,h:18,a:-.38},
      {x:W*.72,y:H*.28,w:W*.20,h:18,a:.38},
      {x:W*.14,y:H*.50,w:18,h:H*.16,a:0},
      {x:W*.86,y:H*.50,w:18,h:H*.16,a:0}
    ];
    if(!resizing || !balls.length){
      balls=[];
      const positions=[
        [.23,.15,0],[.50,.17,1],[.76,.15,0],[.32,.23,2],[.68,.23,2],
        [.50,.28,4],[.50,.39,1],[.23,.48,3],[.77,.48,2],[.20,.58,1],[.33,.66,2],[.67,.66,0],[.78,.58,3]
      ];
      positions.forEach((p,i)=>balls.push({x:W*p[0],y:H*p[1],vx:0,vy:0,r:R,color:p[2]===4?'#ffc322':colors[p[2]],gold:p[2]===4,alive:true,id:i}));
      cue={x:W*.5,y:H*.82,vx:0,vy:0,r:R*1.05,color:'#f5f3e9',cue:true,alive:true};
      shots=0; remaining=12; seconds=90; ended=false; running=true; updateUI();
    } else {
      cue.x=Math.min(W-cue.r,Math.max(cue.r,cue.x));cue.y=Math.min(H-cue.r,Math.max(cue.r,cue.y));
      balls.forEach(b=>{b.x=Math.min(W-b.r,Math.max(b.r,b.x));b.y=Math.min(H-b.r,Math.max(b.r,b.y));});
    }
  }
  function updateUI(){ui.shots.textContent=shots;ui.target.textContent=Math.max(0,remaining);ui.time.textContent=`${String(Math.floor(seconds/60)).padStart(2,'0')}:${String(seconds%60).padStart(2,'0')}`}
  function roundRect(x,y,w,h,r){ctx.beginPath();ctx.roundRect(x,y,w,h,r);}
  function drawPocket(p){
    const g=ctx.createRadialGradient(p.x-6,p.y-8,2,p.x,p.y,p.r);g.addColorStop(0,'#20252b');g.addColorStop(.55,'#050608');g.addColorStop(1,'#000');ctx.fillStyle=g;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#d0b263';ctx.lineWidth=3;ctx.stroke();
  }
  function drawBumper(b){ctx.save();ctx.translate(b.x,b.y);ctx.rotate(b.a);ctx.shadowColor='#000';ctx.shadowBlur=12;ctx.fillStyle='#d79c3c';roundRect(-b.w/2-5,-b.h/2-5,b.w+10,b.h+10,8);ctx.fill();ctx.fillStyle='#13181d';roundRect(-b.w/2,-b.h/2,b.w,b.h,6);ctx.fill();ctx.restore()}
  function drawBall(b){
    if(!b.alive)return;const g=ctx.createRadialGradient(b.x-b.r*.38,b.y-b.r*.42,b.r*.08,b.x,b.y,b.r);g.addColorStop(0,'#fff');g.addColorStop(.16,b.gold?'#fff08a':shade(b.color,32));g.addColorStop(.62,b.color);g.addColorStop(1,shade(b.color,-50));ctx.save();ctx.shadowColor='#0008';ctx.shadowBlur=9;ctx.shadowOffsetY=5;ctx.fillStyle=g;ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;ctx.strokeStyle='#fff7';ctx.lineWidth=1.2;ctx.stroke();if(b.gold){ctx.fillStyle='#fff3a0';ctx.font=`${b.r*1.15}px serif`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('♛',b.x,b.y+1)}ctx.restore();
  }
  function shade(hex,amt){const n=parseInt(hex.slice(1),16),r=Math.max(0,Math.min(255,(n>>16)+amt)),g=Math.max(0,Math.min(255,((n>>8)&255)+amt)),b=Math.max(0,Math.min(255,(n&255)+amt));return '#'+((1<<24)+(r<<16)+(g<<8)+b).toString(16).slice(1)}
  function drawAim(){
    if(!dragging || moving())return;const dx=cue.x-dragX,dy=cue.y-dragY,mag=Math.hypot(dx,dy)||1;const nx=dx/mag,ny=dy/mag;const len=Math.min(aimBoost?H*.62:H*.38,mag*2.6+120);ctx.save();ctx.strokeStyle='#fff';ctx.lineWidth=4;ctx.setLineDash([3,13]);ctx.lineCap='round';ctx.beginPath();ctx.moveTo(cue.x+nx*cue.r*1.2,cue.y+ny*cue.r*1.2);ctx.lineTo(cue.x+nx*len,cue.y+ny*len);ctx.stroke();ctx.setLineDash([]);ctx.globalAlpha=.35;ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(cue.x,cue.y,cue.r+12,0,Math.PI*2);ctx.fill();ctx.restore();
  }
  function draw(){ctx.clearRect(0,0,W,H);pockets.forEach(drawPocket);bumpers.forEach(drawBumper);balls.forEach(drawBall);drawBall(cue);drawAim()}
  function moving(){return [cue,...balls].some(b=>b.alive&&(Math.abs(b.vx)>8||Math.abs(b.vy)>8))}
  function step(dt){
    if(!running||ended||frozen)return;
    const all=[cue,...balls];
    all.forEach(b=>{if(!b.alive)return;b.x+=b.vx*dt;b.y+=b.vy*dt;b.vx*=Math.pow(.986,dt*60);b.vy*=Math.pow(.986,dt*60);if(Math.hypot(b.vx,b.vy)<4){b.vx=b.vy=0}
      const m=b.r+7;if(b.x<m){b.x=m;b.vx=Math.abs(b.vx)*.86;beep(160,.03,.015)} if(b.x>W-m){b.x=W-m;b.vx=-Math.abs(b.vx)*.86;beep(160,.03,.015)} if(b.y<m){b.y=m;b.vy=Math.abs(b.vy)*.86;beep(160,.03,.015)} if(b.y>H-m){b.y=H-m;b.vy=-Math.abs(b.vy)*.86;beep(160,.03,.015)}
      bumpers.forEach(ob=>collideRect(b,ob));
    });
    for(let i=0;i<all.length;i++)for(let j=i+1;j<all.length;j++)collideBalls(all[i],all[j]);
    all.forEach(checkPocket);
  }
  function collideBalls(a,b){if(!a.alive||!b.alive)return;let dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy),min=a.r+b.r;if(d>=min||d===0)return;const nx=dx/d,ny=dy/d,over=min-d;a.x-=nx*over*.5;a.y-=ny*over*.5;b.x+=nx*over*.5;b.y+=ny*over*.5;const rvx=b.vx-a.vx,rvy=b.vy-a.vy,vn=rvx*nx+rvy*ny;if(vn>0)return;const e=.94,j=-(1+e)*vn/2;a.vx-=j*nx;a.vy-=j*ny;b.vx+=j*nx;b.vy+=j*ny;beep(260+Math.min(500,Math.abs(vn)*.6),.035,.018,'triangle')}
  function collideRect(ball,o){
    ctx.save();
    const ca=Math.cos(-o.a),sa=Math.sin(-o.a),dx=ball.x-o.x,dy=ball.y-o.y,lx=dx*ca-dy*sa,ly=dx*sa+dy*ca;const hx=o.w/2,hy=o.h/2;const qx=Math.max(-hx,Math.min(hx,lx)),qy=Math.max(-hy,Math.min(hy,ly));let ex=lx-qx,ey=ly-qy,d=Math.hypot(ex,ey);if(d<ball.r&&d>0){ex/=d;ey/=d;const c=Math.cos(o.a),s=Math.sin(o.a),nx=ex*c-ey*s,ny=ex*s+ey*c;const push=ball.r-d;ball.x+=nx*push;ball.y+=ny*push;const vn=ball.vx*nx+ball.vy*ny;if(vn<0){ball.vx-=1.8*vn*nx;ball.vy-=1.8*vn*ny;beep(190,.035,.018)}}ctx.restore();
  }
  function checkPocket(b){if(!b.alive)return;for(const p of pockets){if(Math.hypot(b.x-p.x,b.y-p.y)<p.r*.78){if(b.cue){beep(110,.16,.05,'sawtooth');b.x=W*.5;b.y=H*.82;b.vx=b.vy=0;}else{b.alive=false;b.vx=b.vy=0;remaining--;beep(b.gold?980:740,.12,.06,'triangle');popScore(b.x,b.y,b.gold?'+3':'✓');if(navigator.vibrate)navigator.vibrate(25);if(remaining<=0)win();}updateUI();break}}
  }
  function popScore(x,y,t){const e=document.createElement('div');e.className='score-pop';e.textContent=t;e.style.left=(x-12)+'px';e.style.top=(y-15)+'px';board.appendChild(e);setTimeout(()=>e.remove(),800)}
  function shoot(x,y){if(!running||ended||moving())return;const dx=cue.x-x,dy=cue.y-y,mag=Math.min(Math.hypot(dx,dy),H*.28);if(mag<18)return;const k=7.8;cue.vx=dx/Math.max(1,Math.hypot(dx,dy))*mag*k;cue.vy=dy/Math.max(1,Math.hypot(dx,dy))*mag*k;shots++;updateUI();ui.hint.classList.add('hide');beep(330,.08,.06,'triangle');if(navigator.vibrate)navigator.vibrate(18)}
  function pos(e){const r=canvas.getBoundingClientRect(),t=e.touches?e.touches[0]:e;return{x:t.clientX-r.left,y:t.clientY-r.top}}
  canvas.addEventListener('pointerdown',e=>{audioCtx.resume();if(!running||ended||moving())return;const p=pos(e);if(Math.hypot(p.x-cue.x,p.y-cue.y)<cue.r*2.1){dragging=true;dragX=p.x;dragY=p.y;canvas.setPointerCapture(e.pointerId)}});
  canvas.addEventListener('pointermove',e=>{if(!dragging)return;const p=pos(e);dragX=p.x;dragY=p.y});
  canvas.addEventListener('pointerup',e=>{if(!dragging)return;const p=pos(e);dragging=false;shoot(p.x,p.y)});
  document.getElementById('pauseBtn').onclick=()=>togglePause(true);
  ui.btn.onclick=()=>{if(ended){setup(false);ui.overlay.classList.remove('show')}else togglePause(false)};
  function togglePause(force){running=force?false:true;ui.title.textContent='Duraklatıldı';ui.text.textContent='Hazır olduğunda devam et.';ui.btn.textContent='DEVAM ET';ui.overlay.classList.toggle('show',!running)}
  function win(){ended=true;running=false;ui.title.textContent='Bölüm Tamamlandı! 👑';ui.text.textContent=`${shots} atışta tüm hedefleri cebe gönderdin.`;ui.btn.textContent='TEKRAR OYNA';ui.overlay.classList.add('show');beep(780,.2,.07);setTimeout(()=>beep(1040,.28,.07),140)}
  function lose(){ended=true;running=false;ui.title.textContent='Süre Bitti';ui.text.textContent=`Kalan hedef: ${remaining}. Bir kez daha dene.`;ui.btn.textContent='TEKRAR OYNA';ui.overlay.classList.add('show');beep(130,.35,.06,'sawtooth')}
  function usePower(id,fn){const el=document.getElementById(id),c=el.querySelector('small');el.onclick=()=>{let n=+c.textContent;if(n<=0||ended)return;c.textContent=--n;audioCtx.resume();fn();beep(620,.08,.05,'triangle')}}
  usePower('aim',()=>{aimBoost=true;setTimeout(()=>aimBoost=false,15000)});
  usePower('freeze',()=>{frozen=true;seconds=Math.min(99,seconds+8);updateUI();setTimeout(()=>frozen=false,1800)});
  usePower('magnet',()=>{balls.filter(b=>b.alive).forEach(b=>{let nearest=pockets[0],d=1e9;pockets.forEach(p=>{const dd=Math.hypot(b.x-p.x,b.y-p.y);if(dd<d){d=dd;nearest=p}});b.vx+=(nearest.x-b.x)*.75;b.vy+=(nearest.y-b.y)*.75})});
  function loop(now){let dt=Math.min(.025,(now-last)/1000);last=now;step(dt);if(running&&!ended&&!frozen){accum+=dt;if(accum>=1){const ticks=Math.floor(accum);seconds-=ticks;accum-=ticks;if(seconds<=0){seconds=0;lose()}updateUI()}}draw();requestAnimationFrame(loop)}
  new ResizeObserver(resize).observe(board);requestAnimationFrame(loop);
})();
</script>
</body>
</html>
